id: fizzbuzz-cli-001
title: FizzBuzz CLI
format: SPRINT
tags: ["Algorithms", "CLI"]
problem: |
  Write a command-line program in any language that prints FizzBuzz from 1 to 100.
  - Print "Fizz" for multiples of 3
  - Print "Buzz" for multiples of 5
  - Print "FizzBuzz" for multiples of both
  - Print the number otherwise

  The program must be runnable from the command line (e.g. `node solution.js` or `python solution.py`).
  Include a brief README.md explaining how to run it.

constraints:
  - Solution must be a single self-contained file
  - No external dependencies (standard library only)
  - Must include a README.md

deliverables:
  - A runnable solution file (any language)
  - README.md with run instructions

