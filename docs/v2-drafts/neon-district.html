<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,600;1,700&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  /* Layout: one full-bleed WebGL stage; broadcast HUD pinned to its four corners and top/bottom centre. Single dark look by choice. */
  :root {
    color-scheme: dark;
    --void: #02030a;
    --ink: #d7f3fb;
    --ink-dim: #6fa3b8;
    --panel: rgba(4, 8, 18, 0.72);
    --line: rgba(120, 220, 255, 0.22);
    --team-a: #ff6a00;
    --team-b: #1f7bff;
    --grid: #00f0ff;
    --dusk: #ff2d7a;
    --judge: #b06bff;
    --alert: #ff3b3b;
    --f-display: "Orbitron", "Eurostile", "Arial Black", sans-serif;
    --f-hud: "Chakra Petch", "Trebuchet MS", "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html, body { height: 100%; }
  body { background: var(--void); color: var(--ink); font-family: var(--f-hud); overflow: hidden; }
  #stage { position: relative; width: 100%; height: 100%; min-height: 420px; overflow: hidden; background: var(--void); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(2,3,10,0.78) 100%),
                repeating-linear-gradient(0deg, rgba(0,0,0,0.10) 0 1px, transparent 1px 3px); }
  .hud { position: absolute; inset: 0; pointer-events: none;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); grid-template-rows: auto 1fr auto; gap: 10px; }
  .lane { align-self: start; min-width: 0; max-width: 320px; background: var(--panel); border: 1px solid var(--line);
    transform: skewX(-9deg); padding: 9px 16px 10px; backdrop-filter: blur(6px); }
  .lane > * { transform: skewX(9deg); }
  .lane.a { border-left: 5px solid var(--team-a); justify-self: start; }
  .lane.b { border-right: 5px solid var(--team-b); justify-self: end; text-align: right; }
  .lane .name { font: italic 700 clamp(13px, 1.9vw, 22px)/1.05 var(--f-hud); letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lane.a .name { color: var(--team-a); } .lane.b .name { color: var(--team-b); }
  .lane .model { font: 400 11px/1.4 var(--f-mono); color: var(--ink-dim); margin-top: 2px; overflow-wrap: anywhere; }
  .lane .stats { display: flex; gap: 12px; margin-top: 7px; font: 700 12px/1 var(--f-mono); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
  .lane.b .stats { justify-content: flex-end; }
  .lane .stats span b { display: block; font: 500 9px/1.5 var(--f-hud); letter-spacing: 0.14em; color: var(--ink-dim); }
  .center { justify-self: center; text-align: center; min-width: 0; }
  .brand { font: 900 clamp(13px, 1.6vw, 18px)/1 var(--f-display); letter-spacing: 0.3em; color: var(--grid); text-shadow: 0 0 14px rgba(0,240,255,0.7); }
  .brand i { font-style: normal; color: var(--team-a); }
  .phase { display: inline-flex; align-items: center; gap: 10px; margin-top: 8px; padding: 5px 14px; background: var(--panel); border: 1px solid var(--line);
    font: 700 12px/1 var(--f-mono); letter-spacing: 0.16em; }
  .phase .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 10px var(--alert); }
  .phase .clock { font-variant-numeric: tabular-nums; color: var(--ink); }
  .momentum { margin: 8px auto 0; width: min(46vw, 420px); height: 8px; background: var(--team-b); position: relative; transform: skewX(-20deg); border: 1px solid var(--line); overflow: hidden; }
  .momentum .fill { position: absolute; inset: 0 auto 0 0; width: 50%; background: var(--team-a); box-shadow: 4px 0 14px #fff; transition: width 0.25s linear; }
  .momentum-label { font: 500 9px/1 var(--f-hud); letter-spacing: 0.24em; color: var(--ink-dim); margin-top: 5px; }
  .radar { grid-row: 3; grid-column: 1; align-self: end; justify-self: start; width: clamp(96px, 15vw, 150px); aspect-ratio: 1; border-radius: 50%;
    border: 2px solid var(--line); background: rgba(2,6,14,0.78); box-shadow: 0 0 0 4px rgba(0,0,0,0.5), 0 0 22px rgba(0,240,255,0.25); }
  .radar canvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .controls { grid-row: 3; grid-column: 2; align-self: end; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
  .controls button { font: 700 11px/1 var(--f-hud); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; transform: skewX(-9deg); }
  .controls button:hover { border-color: var(--grid); color: var(--grid); }
  .controls button:focus-visible { outline: 2px solid var(--grid); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { background: var(--grid); color: var(--void); border-color: var(--grid); }
  .feed { grid-row: 3; grid-column: 3; align-self: end; justify-self: end; min-width: 0; width: min(100%, 330px); display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .feed .row { font: 400 11px/1.25 var(--f-mono); background: var(--panel); padding: 4px 9px; border-right: 3px solid var(--ink-dim); max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: slide 0.25s ease-out; }
  .feed .row.a { border-color: var(--team-a); } .feed .row.b { border-color: var(--team-b); }
  .feed .row b { font-weight: 700; } .feed .row.a b { color: var(--team-a); } .feed .row.b b { color: var(--team-b); }
  .feed .row.err { color: var(--alert); }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  .draft-tag { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); font: 500 9px/1 var(--f-hud); letter-spacing: 0.26em; color: var(--ink-dim); white-space: nowrap; }
  .verdict { position: absolute; left: 0; right: 0; top: 56%; text-align: center; pointer-events: none; opacity: 0; transform: translateX(-60px) skewX(-9deg); transition: opacity 0.5s, transform 0.6s cubic-bezier(.2,.9,.2,1); padding: 0 16px; }
  .verdict.on { opacity: 1; transform: skewX(-9deg); }
  .verdict .k { font: 700 clamp(11px, 1.5vw, 15px)/1 var(--f-mono); letter-spacing: 0.5em; color: var(--ink); }
  .verdict .w { font: italic 700 clamp(30px, 6.4vw, 84px)/0.95 var(--f-hud); text-transform: uppercase; margin-top: 8px; text-wrap: balance;
    color: var(--win, var(--team-a)); text-shadow: 0 0 34px var(--win, var(--team-a)), 4px 4px 0 rgba(0,0,0,0.85); }
  .verdict .s { font: 700 clamp(13px, 2vw, 22px)/1.2 var(--f-mono); margin-top: 12px; font-variant-numeric: tabular-nums; }
  .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 500 15px/1.5 var(--f-hud); color: var(--ink-dim); }
  @media (max-width: 640px) {
    .hud { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
    .center { grid-row: 2; grid-column: 1 / -1; align-self: start; }
    .lane.b { grid-column: 2; }
    .radar { display: none; }
    .controls { grid-column: 1 / -1; grid-row: 3; }
    .feed { display: none; }
    .draft-tag { bottom: 100px; }
  }
  @media (prefers-reduced-motion: reduce) { .feed .row { animation: none; } .verdict { transition: none; } }
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const stage = document.getElementById('stage');
const canvas = document.getElementById('gl');
const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch (e) {
  const f = document.createElement('div'); f.className = 'fallback';
  f.textContent = 'This draft needs WebGL, which this browser or view has turned off. Open it in a desktop browser to see the 3D arena.';
  stage.appendChild(f); throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const COL = { a: new THREE.Color('#ff6a00'), b: new THREE.Color('#1f7bff'), grid: new THREE.Color('#00f0ff'),
  dusk: new THREE.Color('#ff2d7a'), judge: new THREE.Color('#b06bff'), alert: new THREE.Color('#ff3b3b'), fog: new THREE.Color('#0a0518') };
const U = { uTime: { value: 0 } };
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(COL.fog, 0.0019);
const camera = new THREE.PerspectiveCamera(42, 1, 0.5, 4000);

// image-based lighting: a tiny neon "studio" so armor and deck pick up real reflections
{
  const es = new THREE.Scene(); es.background = new THREE.Color(0x04050c);
  const panel = (c, k, w, h, x, y, z) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); es.add(m); };
  panel('#ff6a00', 5, 6, 12, -12, 2, 2); panel('#1f7bff', 6, 6, 12, 12, 2, 2);
  panel('#ff2d7a', 5, 16, 5, 0, 1, -12); panel('#00f0ff', 3, 14, 2, 0, 9, 6);
  panel('#ffffff', 2.5, 10, 1.2, 0, 12, 0); panel('#b06bff', 2, 4, 8, -6, 3, 12); panel('#ffd23c', 2, 4, 8, 7, 0, 11);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.03).texture; pm.dispose();
}
// deterministic rng
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(4);

/* ---------- sky ---------- */
const SUN = new THREE.Vector3(0.0, 0.085, -1).normalize();
scene.add(new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: { uSun: { value: SUN }, ...U },
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); vec4 p = modelViewMatrix*vec4(position,1.); gl_Position = projectionMatrix*p; }`,
  fragmentShader: `varying vec3 vD; uniform vec3 uSun; uniform float uTime;
    float hash(vec3 p){ return fract(sin(dot(p, vec3(12.9898,78.233,45.164)))*43758.5453); }
    void main(){ vec3 d = normalize(vD); float h = d.y;
      vec3 top = vec3(0.004,0.006,0.03), mid = vec3(0.10,0.015,0.20), hor = vec3(0.85,0.16,0.34);
      vec3 c = mix(mid, top, smoothstep(0.02,0.55,h));
      c = mix(hor, c, smoothstep(-0.03,0.20,h));
      c += vec3(0.9,0.35,0.1) * exp(-abs(h)*26.) * 0.35 * max(0., dot(d, uSun));
      float sd = distance(d, uSun);
      float disc = smoothstep(0.235,0.228,sd);
      float band = step(0.42, fract((d.y - uSun.y)*26. - uTime*0.04));
      float cut = mix(1., band, smoothstep(0.03,-0.10, d.y - uSun.y));
      vec3 sunc = mix(vec3(0.95,0.08,0.36), vec3(1.05,0.62,0.14), smoothstep(-0.12,0.2, d.y - uSun.y));
      c = mix(c, sunc, disc*cut);
      c += sunc*0.12*exp(-sd*5.);
      vec3 g = floor(d*260.); float s = step(0.9975, hash(g)) * smoothstep(0.12,0.5,h);
      c += vec3(0.8,0.9,1.)*s*(0.6+0.4*sin(uTime*2.+hash(g+1.)*40.));
      if (h < 0.) c = mix(c, vec3(0.03,0.012,0.06), smoothstep(0.,-0.05,h));
      gl_FragColor = vec4(c,1.); }`
})));

/* ---------- ground: wet asphalt + light grid + street lanes ---------- */
const P = 44; // city block period
const groundMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uA: { value: COL.a }, uB: { value: COL.b }, uFog: { value: COL.fog }, uPhase: { value: new THREE.Color(0, 0, 0) } },
  vertexShader: `varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `varying vec3 vW; uniform float uTime; uniform vec3 uA,uB,uFog,uPhase;
    float line(float v, float w){ float f = abs(fract(v-0.5)-0.5)/fwidth(v); return 1.-min(f/w,1.); }
    void main(){ vec2 p = vW.xz; float r = length(p);
      vec3 c = vec3(0.012,0.014,0.03);
      float g = max(line(p.x/4.,1.2), line(p.y/4.,1.2));
      float G = max(line(p.x/${P}.,1.6), line(p.y/${P}.,1.6));
      vec3 gc = vec3(0.,0.94,1.);
      float pulse = exp(-abs(r - mod(uTime*46., 620.))*0.05);
      c += gc*g*(0.05 + 0.5*pulse)*exp(-r*0.004);
      c += gc*G*(0.5 + 1.4*pulse)*exp(-r*0.0022);
      vec2 rd = abs(mod(p + ${P/2}., ${P}.) - ${P/2}.);
      float dash = step(0.5, fract((rd.x < rd.y ? p.y : p.x)/7.));
      float lane = (1.-smoothstep(0.,0.35, abs(min(rd.x,rd.y)-3.2))) * dash * step(74., r);
      c += vec3(1.0,0.72,0.2)*lane*0.55;
      float side = smoothstep(-30.,30.,p.x);
      c += mix(uA,uB,side)*0.10*exp(-r*0.012);
      c += uPhase*0.12*exp(-r*0.01);
      float d = length(cameraPosition - vW); c = mix(uFog, c, exp(-d*d*0.0000036));
      gl_FragColor = vec4(c,1.); }`
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), groundMat);
ground.rotation.x = -Math.PI / 2; scene.add(ground);

/* ---------- city ---------- */
const bGeo = new THREE.BoxGeometry(1, 1, 1); bGeo.translate(0, 0.5, 0);
const builds = [];
const tints = [COL.grid, COL.dusk, COL.a, COL.b, new THREE.Color('#ffd23c'), COL.judge];
for (let i = -11; i <= 11; i++) for (let j = -11; j <= 11; j++) {
  const cx = i * P + P / 2, cz = j * P + P / 2, r = Math.hypot(cx, cz);
  if (r < 118) continue;
  const n = rnd() < 0.45 ? 2 : 1;
  for (let k = 0; k < n; k++) {
    if (rnd() < 0.08) continue;
    const w = n === 2 ? 12 + rnd() * 5 : 18 + rnd() * 12, d = n === 2 ? 26 + rnd() * 4 : 18 + rnd() * 12;
    let h = 14 + rnd() * 46 + Math.min(r, 300) * 0.16 * rnd();
    if (rnd() < 0.07) h += 90 + rnd() * 110;
    if (cz < -120 && Math.abs(cx) < 70) h *= 0.45; // keep the sun lane open
    builds.push({ x: cx + (n === 2 ? (k ? 8.5 : -8.5) : 0), z: cz, w, d, h, seed: rnd() * 100, tint: tints[(rnd() * tints.length) | 0] });
  }
}
const cityMat = new THREE.ShaderMaterial({
  uniforms: { ...U, uFog: { value: COL.fog } },
  vertexShader: `attribute float aSeed; attribute vec3 aTint; varying vec3 vL, vS, vN, vW, vTint; varying float vSeed;
    void main(){ vL = position; vN = normal; vSeed = aSeed; vTint = aTint;
      vS = vec3(length(instanceMatrix[0].xyz), length(instanceMatrix[1].xyz), length(instanceMatrix[2].xyz));
      vec4 w = modelMatrix*instanceMatrix*vec4(position,1.); vW = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `varying vec3 vL, vS, vN, vW, vTint; varying float vSeed; uniform float uTime; uniform vec3 uFog;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    void main(){ vec3 c = vec3(0.012,0.014,0.028); float H = vS.y;
      if (abs(vN.y) > 0.5) {
        vec2 e = (0.5-abs(vL.xz))*vS.xz; float rim = 1.-smoothstep(0.,0.8,min(e.x,e.y));
        c += vTint*rim*1.5;
      } else {
        bool fx = abs(vN.x) > 0.5; float u = (fx ? vL.z*vS.z : vL.x*vS.x); float wdt = fx ? vS.z : vS.x; float v = vL.y*H;
        vec2 cell = floor(vec2(u/2.6, v/3.6)); vec2 f = fract(vec2(u/2.6, v/3.6));
        float lit = step(0.66, hash(cell + vSeed));
        float tw = step(0.985, hash(cell*1.7 + vSeed + floor(uTime*0.6)));
        float win = step(0.18,f.x)*step(f.x,0.82)*step(0.22,f.y)*step(f.y,0.74);
        vec3 wc = mix(vec3(1.0,0.72,0.38), vTint, step(0.55, hash(cell.yy + vSeed*3.)));
        c += wc*win*max(lit - tw, 0.)*(0.35 + 0.5*hash(cell+9.));
        float top = smoothstep(H-1.1, H-0.5, v);
        float edge = 1.-smoothstep(0.,0.45, wdt*0.5 - abs(u));
        float bandOn = step(0.62, fract(vSeed*7.3));
        float band = bandOn*(1.-smoothstep(0.,0.35, abs(mod(v, 18.)-9.)));
        c += vTint*(top*2.2 + edge*1.3 + band*1.1);
        c *= 0.35 + 0.65*smoothstep(0., 16., v);
      }
      float d = length(cameraPosition - vW); c = mix(uFog, c, exp(-d*d*0.0000030));
      gl_FragColor = vec4(c,1.); }`
});
const city = new THREE.InstancedMesh(bGeo, cityMat, builds.length);
{
  const m = new THREE.Matrix4(), seeds = new Float32Array(builds.length), tn = new Float32Array(builds.length * 3);
  builds.forEach((b, i) => { m.makeScale(b.w, b.h, b.d); m.setPosition(b.x, 0, b.z); city.setMatrixAt(i, m); seeds[i] = b.seed; b.tint.toArray(tn, i * 3); });
  bGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seeds, 1));
  bGeo.setAttribute('aTint', new THREE.InstancedBufferAttribute(tn, 3));
  city.frustumCulled = false; scene.add(city);
}

/* ---------- traffic: light trails on the street grid ---------- */
const trailGeo = new THREE.BoxGeometry(0.7, 0.5, 26); trailGeo.translate(0, 0, -13);
const trailMat = (c) => new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uC: { value: c } },
  vertexShader: `varying float vZ; void main(){ vZ = -position.z/26.; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `varying float vZ; uniform vec3 uC; void main(){ float a = pow(1.-vZ, 2.2); gl_FragColor = vec4(uC*2.4*a + vec3(1.)*step(vZ,0.03), a); }` });
const tMats = [COL.grid, COL.dusk, new THREE.Color('#ffd23c'), new THREE.Color('#ffffff')].map(trailMat);
const cars = [];

const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.55, 0.9); composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- radar ---------- */
const rc = $('radar').getContext('2d');

  const head = Math.atan2(camera.position.x - look.x, camera.position.z - look.z); rc.rotate(head);

  rc.strokeStyle = 'rgba(0,240,255,0.8)'; rc.lineWidth = 2; rc.beginPath(); rc.arc(0, 0, 70 * k, 0, 6.3); rc.stroke();
  for (const car of cars) { const x = car.axis === 'x' ? car.pos : car.lane, z = car.axis === 'x' ? car.lane : car.pos; rc.fillStyle = 'rgba(255,255,255,0.75)'; rc.fillRect(x * k - 1.5, z * k - 1.5, 3, 3); }

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let radarT = 0;

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), now = (U.uTime.value += dt);

    if ((sim.next -= dt) <= 0) { sim.next = 0.18 + Math.random() * 0.6; const bias = 0.5 + 0.38 * Math.sin(now * 0.23 + sim.cycle); const id = Math.random() < bias ? 'a' : 'b'; const r = Math.random();
      emit(id, r < 0.42 ? 'REASONING' : r < 0.74 ? 'TOOL_CALL' : r < 0.94 ? 'FILE_CREATE' : 'ERROR'); }

  else if (sim.phase === 'VERDICT') { if (Math.random() < dt * 5) { const w = sim.winner; tmp.set((Math.random() - 0.5) * 150, 45 + Math.random() * 50, (Math.random() - 0.5) * 150 - 20); spark(tmp, Math.random() < 0.7 ? COL[w] : new THREE.Color(1, 1, 1), 110, 26, 1.8, 9, 0, 1.5); }

    for (const bm of beams[t.id]) bm.uniforms.uI.value += ((0.12 + t.energy * 0.75) - bm.uniforms.uI.value) * dt * 4; }

    f.m.position.lerpVectors(f.start, f.to, e); f.m.position.y += Math.sin(f.t * Math.PI) * 9; f.m.scale.setScalar(0.2 + 0.8 * e);

  for (const c of cars) { c.pos += c.speed * c.dir * dt; if (c.pos > 520) c.pos = -520; if (c.pos < -520) c.pos = 520; c.axis === 'x' ? c.m.position.set(c.pos, 0.6, c.lane) : c.m.position.set(c.lane, 0.6, c.pos); }

  else { look.set(0, 9, 0); camera.position.set(Math.sin(free.th) * Math.sin(free.ph) * free.r, 9 + Math.cos(free.ph) * free.r, Math.cos(free.th) * Math.sin(free.ph) * free.r); if (camera.fov !== 42) { camera.fov = 42; camera.updateProjectionMatrix(); } }
