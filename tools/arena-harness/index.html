<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arena4Ai — isometric renderer harness (AA-065)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens mirrored from @arena/shared design/tokens.ts. The HUD is the HOST's
   job — the renderer core owns none of this. That is the point of the split. */
:root{
  --void:#03060b; --line:#0f2234; --ice:#d7e9f2; --ice-2:#7fa6b8; --ice-3:#3d6478;
  --chrome:#9fd4e6; --gold:#ffd700; --red:#ff3b5c;
  --font-display:"Inter Tight",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void);color:var(--ice);font-family:var(--font-display);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.stage{position:fixed;inset:0}
canvas#arena{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(3,6,11,.75) 100%)}

.hud{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;font-family:var(--font-mono)}
.hud-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;padding:16px 20px 0;gap:16px}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.14em}
.wordmark b{color:#ff7a18}
.brief{font-size:11px;color:var(--ice-2);max-width:38ch;margin-top:5px}
.clock{display:flex;flex-direction:column;align-items:center;gap:6px}
.clock .t{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.phase{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--ice-2);padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:rgba(7,16,24,.7)}
.judge{text-align:right;font-size:10.5px;color:var(--ice-3);line-height:1.7;text-transform:uppercase;letter-spacing:.08em}

.mid{position:relative}
/* DEFECT 1 FIX — the lanes are measured and reported to the renderer as
   viewport insets, so the world is composed inside what is left instead of
   underneath them. See measureInsets(). A fixed margin would break at the next
   breakpoint; this cannot. */
.lane{position:absolute;top:20px;width:min(260px,24vw);display:flex;flex-direction:column;gap:8px}
.lane.left{left:20px}.lane.right{right:20px;align-items:flex-end;text-align:right}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border-radius:4px;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 9%,rgba(7,16,24,.85))}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.tag small{font-weight:500;letter-spacing:.06em;text-transform:none;font-size:11px;opacity:.8}
.variant{font-size:10px;color:var(--ice-3)}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:12px;font-size:11px}
.lane.right .stats{direction:rtl}
.stat b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--font-display)}
.stat span{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ice-3)}
.stat.err b{color:var(--red)}
/* Honest-absence badge — the stat panel must never show a number whose basis
   the floor is hiding. */
.telemetry{font-size:9.5px;letter-spacing:.06em;padding:4px 8px;border-radius:3px;border:1px solid;max-width:100%}
.telemetry.measured{color:var(--ice-3);border-color:var(--line)}
.telemetry.inferred{color:var(--gold);border-color:rgba(255,215,0,.4);background:rgba(255,215,0,.06)}
.telemetry.unavailable{color:var(--red);border-color:rgba(255,59,92,.45);background:rgba(255,59,92,.07)}
.latest{font-size:11px;color:color-mix(in srgb,var(--c) 75%,var(--ice));min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.hud-bottom{pointer-events:auto;display:grid;grid-template-columns:1fr minmax(320px,38%) 1fr;gap:16px;align-items:end;padding:0 20px 14px}
/* DEFECT 2 FIX — the spike gave the ticker `height:96px;overflow:hidden` while
   feeding it 8 rows at ~16.3px each (130px), so the top two rows were cut off
   mid-glyph. The box now derives its height from the row count it is actually
   given, and the fade is a fade rather than a guillotine. */
.ticker{--rows:6;--row-h:17px;font-size:10.5px;line-height:var(--row-h);color:var(--ice-3);
  display:flex;flex-direction:column;justify-content:flex-end;
  height:calc(var(--rows) * var(--row-h));overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent 0,#000 28%);mask-image:linear-gradient(transparent 0,#000 28%)}
.ticker div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:var(--row-h)}
.ticker .t{margin-right:8px}
.ticker .who{font-weight:700;margin-right:8px}
.ticker .ty{color:var(--ice-2);margin-right:8px}
.ticker .e{color:var(--red)}
.momentum{display:flex;flex-direction:column;gap:6px;padding:9px 13px;border:1px solid var(--line);background:rgba(7,16,24,.85);border-radius:6px}
.momentum .row{display:flex;justify-content:space-between;font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.momentum .row span:nth-child(2){color:var(--ice-3);font-weight:500}
.mbar{position:relative;height:9px;background:#020609;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.mbar i{position:absolute;top:0;bottom:0;transition:left .18s,width .18s}
.mbar em{position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--ice-3)}
.transport{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap;font-size:10.5px;color:var(--ice-2)}
.transport button,.transport select{padding:5px 9px;border:1px solid var(--line);border-radius:4px;letter-spacing:.1em;text-transform:uppercase;font-size:10px;background:rgba(7,16,24,.9);color:var(--ice-2);font-family:var(--font-mono)}
.transport button:hover,.transport button.on{border-color:var(--chrome);color:var(--chrome)}
.scrub{-webkit-appearance:none;appearance:none;width:130px;height:4px;background:var(--line);border-radius:2px}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--chrome)}
.perf{position:absolute;left:50%;transform:translateX(-50%);top:88px;font-family:var(--font-mono);font-size:10px;color:var(--ice-3);text-align:center;line-height:1.7;pointer-events:none;white-space:nowrap}
.perf b{color:var(--chrome);font-weight:600}
.boot{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-mono);font-size:12px;color:var(--red);padding:40px;text-align:center;line-height:1.9}
</style>
</head>
<body>
<div class="stage">
  <canvas id="arena"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div class="hud-top">
      <div>
        <div class="wordmark">ARENA<b>4</b>AI</div>
        <div class="brief">renderer harness · <span id="scenario-label">2 teams · modern telemetry</span></div>
      </div>
      <div class="clock"><div class="t" id="clock">2:00</div><div class="phase" id="phase">Running</div></div>
      <div class="judge">
        <div>@arena/shared · IsoArenaRenderer</div>
        <div>framework-free · canvas 2d</div>
      </div>
    </div>
    <div class="mid">
      <div class="lane left" id="laneA"></div>
      <div class="lane right" id="laneB"></div>
    </div>
    <div class="hud-bottom">
      <div class="ticker" id="ticker"></div>
      <div class="momentum">
        <div class="row"><span id="mA"></span><span>momentum · last 10s</span><span id="mB"></span></div>
        <div class="mbar"><i id="mfill"></i><em></em></div>
      </div>
      <div class="transport">
        <select id="scenario">
          <option value="modern">modern · 9 files</option>
          <option value="mixed">mixed · one legacy team</option>
          <option value="legacy">legacy · pre-c965642</option>
          <option value="prose">absent · prose, no paths</option>
          <option value="undeclared">absent · undeclared provider</option>
          <option value="live">LIVE · incremental append (AA-066 path)</option>
          <option value="three">bands · 3 teams</option>
          <option value="four">bands · 4 teams</option>
          <option value="stress">stress · 220 files / team</option>
          <option value="rollup">rollup · 900 files / team</option>
        </select>
        <button id="play">Pause</button>
        <button data-speed="1">1×</button><button data-speed="3" class="on">3×</button><button data-speed="8">8×</button>
        <input class="scrub" id="scrub" type="range" min="0" max="1000" value="0" aria-label="Scrub">
        <button id="cam" class="on">Cam</button>
      </div>
    </div>
  </div>
  <div class="perf" id="perf"></div>
</div>

<script type="module">
import {
  IsoArenaRenderer, toFrameEvents, MODEL_COLORS, getModelColor,
} from '../../packages/shared/dist/arena/index.js';
import { generateStream } from './stream.js';

const $ = (id) => document.getElementById(id);

const TEAMS = [
  { id: 'team-a', model: 'claude', persona: 'architect',   modelVariant: 'claude-opus-5' },
  { id: 'team-b', model: 'codex',  persona: 'speedrunner', modelVariant: 'gpt-5.3-codex' },
];

// An adapter that has not declared its capabilities in PROVIDER_FILE_CAPABILITIES.
// It reports paths perfectly well but no operation, so its floor is placed and
// then held flat and hatched — the case that cannot be seen event-by-event.
const TEAMS_3 = [
  { id: 'team-a', model: 'claude', persona: 'architect',   modelVariant: 'claude-opus-5' },
  { id: 'team-b', model: 'codex',  persona: 'speedrunner', modelVariant: 'gpt-5.3-codex' },
  { id: 'team-c', model: 'gemini', persona: 'pioneer',     modelVariant: 'gemini-3-pro' },
];
const TEAMS_4 = [
  ...TEAMS_3,
  { id: 'team-d', model: 'claude', persona: 'adversarial', modelVariant: 'claude-sonnet-5' },
];

const TEAMS_UNDECLARED = [
  TEAMS[0],
  { id: 'team-b', model: 'mistral', persona: 'speedrunner', modelVariant: 'mistral-large' },
];

const SCENARIOS = {
  modern: { mode: 'modern', filesPerTeam: 9,   label: '2 teams · modern telemetry' },
  mixed:  { mode: 'mixed',  filesPerTeam: 9,   label: '2 teams · codex on legacy payloads' },
  legacy: { mode: 'legacy', filesPerTeam: 9,   label: '2 teams · pre-c965642, no op telemetry' },
  prose:  { mode: 'prose',  filesPerTeam: 9,   label: '2 teams · right team narrates prose, no paths at all' },
  undeclared: { mode: 'modern', filesPerTeam: 9, teams: TEAMS_UNDECLARED, label: '2 teams · right provider declares no file-op capability' },
  // Drives the EXACT path ArenaViewerV2 uses in a running competition:
  // construct with an empty stream, appendEvents() as they arrive, setTime()
  // from a host-owned clock. The floor is not sized up front and must regrow.
  live: { mode: 'modern', filesPerTeam: 140, live: true, label: 'LIVE · empty start, appendEvents + setTime, floor regrows' },
  three: { mode: 'modern', filesPerTeam: 30, teams: TEAMS_3, label: '3 teams · parallel bands' },
  four:  { mode: 'modern', filesPerTeam: 30, teams: TEAMS_4, label: '4 teams · parallel bands' },
  // 220 sits just under MAX_BLOCKS_PER_TEAM, so this is the real one-block-per-
  // file stress: 440 blocks on the floor at once, which the spike's fixed 8×5
  // grid could not have drawn — it had 61 cells a side and stacked the rest.
  stress: { mode: 'modern', filesPerTeam: 220, label: '2 teams · 220 files each · 440 blocks' },
  rollup: { mode: 'modern', filesPerTeam: 900, label: '2 teams · 900 files each · directory rollup' },
};

const canvas = $('arena');
const ctx = canvas.getContext('2d');
let R = null, playing = true, speed = 3, scrubbing = false, lastTs = 0;
let frames = 0, fpsAcc = 0, fps = 0, buildMs = 0;

function measureInsets() {
  // DEFECT 1 FIX. The HUD reports the space it occupies; the renderer composes
  // the world into what is left. Nothing here is a tuned constant.
  const a = $('laneA').getBoundingClientRect();
  const b = $('laneB').getBoundingClientRect();
  const top = $('.hud-top') ? 0 : 0;
  return {
    top: 92,
    bottom: 132,
    left: Math.max(0, a.right + 16),
    right: Math.max(0, innerWidth - b.left + 16),
  };
}

function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R?.setViewport({ width: innerWidth, height: innerHeight, dpr, insets: measureInsets() });
}
addEventListener('resize', resize);

function laneHtml(tm) {
  const c = getModelColor(tm.model);
  return `<div class="tag" style="--c:${c}"><i></i>${tm.model}<small>· ${tm.persona}</small></div>
  <div class="variant">${tm.modelVariant}</div>
  <div class="stats">
    <div class="stat"><b id="${tm.id}-files">0</b><span>files</span></div>
    <div class="stat"><b id="${tm.id}-edits">0</b><span>edits</span></div>
    <div class="stat"><b id="${tm.id}-tools">0</b><span>tools</span></div>
    <div class="stat err"><b id="${tm.id}-errors">0</b><span>errors</span></div>
  </div>
  <div class="telemetry" id="${tm.id}-tel"></div>
  <div class="latest" id="${tm.id}-latest" style="--c:${c}"></div>`;
}

let liveFeed = null;

function load(name) {
  const sc = SCENARIOS[name];
  $('scenario-label').textContent = sc.label;
  const t0 = performance.now();
  const teams = sc.teams ?? TEAMS;
  const { events, timeLimitMs, originMs } = generateStream({ ...sc, seed: 7, teams });
  const frame = toFrameEvents(events, originMs);
  liveFeed = null;
  if (sc.live) {
    // Empty construction, exactly as the app does for a running competition.
    R = new IsoArenaRenderer({ teams, events: [], timeLimitMs });
    liveFeed = { pending: frame, cursor: 0, clock: 0 };
  } else {
  R = new IsoArenaRenderer({ teams, events: frame, timeLimitMs });
  }
  R.attach(ctx);
  R.setWinner('team-a');
  buildMs = performance.now() - t0;
  $('laneA').innerHTML = laneHtml(teams[0]);
  $('laneB').innerHTML = laneHtml(teams[1]);
  $('mA').textContent = '◀ ' + teams[0].model; $('mA').style.color = getModelColor(teams[0].model);
  $('mB').textContent = teams[1].model + ' ▶'; $('mB').style.color = getModelColor(teams[1].model);
  window.__teams = teams;
  window.__eventCount = frame.length;
  window.__R = R;   // harness diagnostics only; the app never reaches in like this
  resize();
  playing = true;
  $('play').textContent = 'Pause';
}

function fmt(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

let hudAcc = 0;
function updateHud() {
  const w = R.world, now = w.t;
  $('clock').textContent = w.phase === 'active' ? fmt(Math.max(0, R.timeLimitMs - now))
    : w.phase === 'freeze' ? '0:00' : w.phase === 'judging' ? '···' : 'END';
  $('phase').textContent = w.compState;

  if (hudAcc++ % 3 === 0) {
    for (const team of w.teams.values()) {
      // The harness HUD has lanes for the first two teams only; a 3- or 4-team
      // scenario has world teams with no DOM behind them. Guard rather than
      // throw — an exception here kills the animation frame and the arena stops
      // dead, which is exactly how a HUD bug gets mistaken for a renderer bug.
      if (!$(`${team.id}-files`)) continue;
      for (const k of ['files', 'edits', 'tools', 'errors']) $(`${team.id}-${k}`).textContent = team.counts[k];
      $(`${team.id}-latest`).textContent = team.latest || '—';
      const tel = $(`${team.id}-tel`);
      const mode = team.telemetry.editDepth;
      tel.className = `telemetry ${mode}`;
      tel.textContent =
        mode === 'measured' ? `edits measured · op from ${team.telemetry.capability.opSource}`
        : mode === 'inferred' ? 'edits INFERRED · no op telemetry in these events'
        : 'edits UNAVAILABLE · heights flat, not low';
    }
  }
  if (hudAcc % 4 === 0) {
    $('ticker').innerHTML = w.log.slice(-6).map((ev) => {
      const team = w.teams.get(ev.teamId);
      const c = team ? team.color : '#7fa6b8';
      return `<div><span class="t">${fmt(ev.t)}</span><span class="who" style="color:${c}">${team?.model ?? '—'}</span>` +
        `<span class="ty">${ev.kind}</span><span class="${ev.kind === 'error' ? 'e' : ''}">${ev.path ?? ev.text}</span></div>`;
    }).join('');
  }

  const m = {};
  for (const r of w.recent) if (now - r.t < 10000) m[r.teamId] = (m[r.teamId] || 0) + 1;
  const tm = window.__teams ?? TEAMS;
  const a = m[tm[0].id] || 0, b = m[tm[1].id] || 0;
  const mom = (a + b) ? (b - a) / (a + b) : 0;
  const f = $('mfill');
  const cA = getModelColor(tm[0].model), cB = getModelColor(tm[1].model);
  f.style.left = mom < 0 ? (50 + mom * 50) + '%' : '50%';
  f.style.width = Math.abs(mom) * 50 + '%';
  f.style.background = mom < 0 ? cA : cB;

  $('perf').innerHTML =
    `<b>${fps.toFixed(0)}</b> fps · <b>${w.structures.size}</b> blocks<br>` +
    `<b>${window.__eventCount}</b> events · build <b>${buildMs.toFixed(0)}</b>ms<br>` +
    `grid <b>${w.grid.gx}×${w.grid.gz}</b> · cells <b>${w.grid.capacity}</b>`;

  if (!scrubbing) $('scrub').value = Math.round((w.t / R.totalMs) * 1000);
}

function frame(ts) {
  const dt = Math.min(100, ts - (lastTs || ts));
  lastTs = ts;
  fpsAcc = fpsAcc * 0.9 + (dt > 0 ? 1000 / dt : 0) * 0.1;
  if (frames++ % 10 === 0) fps = fpsAcc;

  if (playing) {
    if (liveFeed) {
      // Host-owned clock + incremental append — the AA-066 live contract.
      liveFeed.clock += dt * speed;
      const fresh = [];
      while (liveFeed.cursor < liveFeed.pending.length
             && liveFeed.pending[liveFeed.cursor].t <= liveFeed.clock + 1500) {
        fresh.push(liveFeed.pending[liveFeed.cursor++]);
      }
      if (fresh.length) R.appendEvents(fresh);
      R.setTime(liveFeed.clock);
      if (liveFeed.cursor >= liveFeed.pending.length && liveFeed.clock > R.totalMs) {
        playing = false; $('play').textContent = 'Replay';
      }
    } else {
      R.tick(dt * speed);
      if (R.world.t >= R.totalMs) { playing = false; $('play').textContent = 'Replay'; }
    }
  }
  if (R.camera.orbit && R.world.phase !== 'reveal') R.camera.tyaw = -0.62 + Math.sin(ts / 9000) * 0.14;
  R.draw();
  updateHud();
  requestAnimationFrame(frame);
}

// ─── boot ───────────────────────────────────────────────────────────────────
$('laneA').innerHTML = laneHtml(TEAMS[0]);
$('laneB').innerHTML = laneHtml(TEAMS[1]);
$('mA').textContent = '◀ ' + TEAMS[0].model; $('mA').style.color = getModelColor(TEAMS[0].model);
$('mB').textContent = TEAMS[1].model + ' ▶'; $('mB').style.color = getModelColor(TEAMS[1].model);

$('scenario').onchange = (e) => load(e.target.value);
$('play').onclick = () => {
  if (R.world.t >= R.totalMs) R.seek(0);
  playing = !playing;
  $('play').textContent = playing ? 'Pause' : 'Play';
};
document.querySelectorAll('[data-speed]').forEach((b) => b.onclick = () => {
  speed = +b.dataset.speed;
  document.querySelectorAll('[data-speed]').forEach((x) => x.classList.toggle('on', x === b));
});
$('cam').onclick = () => { R.camera.orbit = !R.camera.orbit; $('cam').classList.toggle('on', R.camera.orbit); };
$('scrub').addEventListener('input', (e) => { scrubbing = true; R.seek((+e.target.value / 1000) * R.totalMs); });
$('scrub').addEventListener('change', () => { scrubbing = false; });
addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); } });

load('modern');
requestAnimationFrame(frame);
</script>
</body>
</html>
